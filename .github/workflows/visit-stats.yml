name: visit-stats

# 每天记录一次访问量快照到 stats/visits.json（页面只读这个同站文件来画折线图）
on:
  schedule:
    - cron: '57 23 * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/visit-stats.yml'
      - 'scripts/record-visit-snapshot.zbg'
      - 'zbg.js'

permissions:
  contents: write

concurrency:
  group: visit-stats
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 记录快照（ZBG 脚本 —— 本站自己写的语言）
        run: node zbg.js scripts/record-visit-snapshot.zbg

      - name: 提交变化
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stats/visits.json
          if git diff --cached --quiet; then
            echo "无变化，跳过提交"
            exit 0
          fi
          git commit -m "chore(stats): 记录 $(date -u +%F) 访问量快照"
          git pull --rebase origin main
          git push
