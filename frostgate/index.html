<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>霜降 · 点个心解锁第二关</title>
<link rel="stylesheet" href="assets/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>❄</text></svg>">
</head>
<body>
<main class="app">

  <header class="hd">
    <h1>霜降</h1>
    <p class="sub">点碎冰晶，撑过两关。<br>第二关要给项目<b>点个心</b>才开。</p>
  </header>

  <section class="levels" id="levels"></section>

  <section class="stage" id="stage" hidden>
    <div class="hud">
      <span class="hud-item">关卡 <b id="hudLevel">1</b></span>
      <span class="hud-item">得分 <b id="hudScore">0</b> / <b id="hudTarget">20</b></span>
      <span class="hud-item">连击 <b id="hudCombo">0</b></span>
      <span class="hud-item">生命 <b id="hudLife">3</b></span>
    </div>
    <div class="grid" id="grid"></div>
    <div class="stage-foot">
      <button class="btn ghost" id="btnQuit">退出</button>
      <button class="btn" id="btnRestart">重来</button>
    </div>
  </section>

  <div class="overlay" id="overlay" hidden>
    <div class="card">
      <div class="card-icon" id="ovIcon">🔒</div>
      <h2 id="ovTitle">第二关还没解锁</h2>
      <p id="ovText">给这个项目点个星（心），就能打开「极寒」。</p>
      <button class="btn primary" id="ovAction">♥ 去点个心</button>
      <button class="btn ghost" id="ovClose">先玩第一关</button>
    </div>
  </div>

  <footer class="ft">
    <span id="ftNote">toy-sdk.js · 纯静态 · GitHub Pages</span>
  </footer>

</main>
<script src="sdk/config.js"></script>
<script src="sdk/toy-sdk.js"></script>
<script src="game/levels.js"></script>
<script src="game/game.js"></script>
</body>
</html>
