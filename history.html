<!DOCTYPE html>
<html lang="zh-CN">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
 <title>历史版本下载 - 文字游戏-主播模拟器</title>
 <meta name="theme-color" content="#ffffff">
 <link rel="icon" href="favicon.ico" type="image/x-icon">
 <script>
 /* 首屏渲染前先把主题定下来，避免亮/暗闪一下（与首页一致） */
 (function () {
  var t = null;
  try { t = localStorage.getItem('theme'); } catch (e) {}
  if (t !== 'dark' && t !== 'light') {
   t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
  }
  document.documentElement.setAttribute('data-theme', t);
 })();
 </script>
 <style>
 :root {
 color-scheme: light;
 --bg-color: #ffffff;
 --text-main: #1a1a1a;
 --text-sub: #666666;
 --btn-bg: #4a4a4a;
 --btn-text: #ffffff;
 --btn-icon: #ffffff;
 --bar-bg: #ffffff;
 --bar-border: #ececec;
 --link-color: #1a73e8;
 --card-bg: #ffffff;
 --card-border: #ececec;
 --card-hover-border: #d8d8d8;
 --row-hover: rgba(0, 0, 0, 0.04);
 --switch-track: rgba(0, 0, 0, 0.7);
 --switch-track-on: rgba(0, 0, 0, 0.45);
 --switch-shadow: rgba(0, 0, 0, 0.3);
 --switch-shadow-on: rgba(0, 0, 0, 0.1);
 --switch-knob: #d7d7d7;
 --switch-sun: #fdea7b;
 }

 /* 夜间模式 */
 html[data-theme="dark"] {
 color-scheme: dark;
 --bg-color: #0f0f0f;
 --text-main: #f2f2f2;
 --text-sub: #9a9a9a;
 --btn-bg: #fdea7b;
 --btn-text: #1a1a1a;
 --btn-icon: #1a1a1a;
 --bar-bg: #161616;
 --bar-border: #262626;
 --link-color: #6aa9ff;
 --card-bg: #161616;
 --card-border: #262626;
 --card-hover-border: #3a3a3a;
 --row-hover: rgba(255, 255, 255, 0.06);
 --switch-track: rgba(255, 255, 255, 0.22);
 --switch-track-on: rgba(255, 255, 255, 0.12);
 --switch-shadow: rgba(0, 0, 0, 0.45);
 --switch-shadow-on: rgba(0, 0, 0, 0.25);
 --switch-knob: #eaeaea;
 --switch-sun: #fdea7b;
 }

 * {
 margin: 0;
 padding: 0;
 box-sizing: border-box;
 font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
 -webkit-tap-highlight-color: transparent;
 }

 html, body { height: 100%; }

 body {
 background-color: var(--bg-color);
 color: var(--text-main);
 min-height: 100vh;
 display: flex;
 flex-direction: column;
 transition: background-color 0.45s ease, color 0.45s ease;
 touch-action: pan-y pinch-zoom;
 }

 /* 日/夜切换：颜色/描边平滑过渡 */
 body,
 .topbar,
 .topbar-title,
 .back-btn,
 .ver-card,
 .ver-name,
 .ver-size,
 .dl-btn {
 transition:
 background-color 0.45s ease,
 color 0.45s ease,
 border-color 0.45s ease,
 fill 0.45s ease;
 }

 /* ---- 第一行：标题栏（左 文字 / 右 日夜间开关）---- */
 .topbar {
 flex-shrink: 0;
 position: sticky;
 top: 0;
 z-index: 10;
 background: var(--bar-bg);
 border-bottom: 1px solid var(--bar-border);
 }
 .topbar-inner {
 height: 64px;
 display: flex;
 align-items: center;
 gap: 12px;
 padding: 0 24px;
 }
 .topbar-title {
 font-size: 17px;
 font-weight: 600;
 color: var(--text-main);
 letter-spacing: 0.5px;
 min-width: 0;
 white-space: nowrap;
 overflow: hidden;
 text-overflow: ellipsis;
 }

 /* ---- 主体 ---- */
 .stage {
 width: 100%;
 max-width: 720px;
 margin: 0 auto 0 0;   /* 左对齐，与首页同一套栅格 */
 padding: 24px 24px 56px;
 display: flex;
 flex-direction: column;
 align-items: stretch;
 }

 /* ---- 第二行：返回首页 ---- */
 .back-btn {
 display: flex;
 align-items: center;
 justify-content: center;
 gap: 8px;
 width: 100%;
 padding: 14px 16px;
 font-size: 15px;
 font-weight: 600;
 letter-spacing: 0.3px;
 color: var(--text-main);
 background-color: transparent;
 border: 1px dashed var(--card-border);
 border-radius: 14px;
 text-decoration: none;
 transition:
 background-color 0.45s ease,
 border-color 0.2s ease,
 color 0.2s ease;
 }
 .back-btn:hover {
 border-color: var(--link-color);
 color: var(--link-color);
 }
 .back-btn:active {
 transform: scale(0.995);
 }
 .back-btn .arrow {
 font-size: 16px;
 line-height: 1;
 }

 /* ---- 卡片列表：一行一个，彼此分开（不连成一块）---- */
 .ver-list {
 margin-top: 16px;
 display: flex;
 flex-direction: column;
 gap: 12px;   /* 卡片之间的空隙 */
 }
 .ver-card {
 display: flex;
 align-items: center;
 justify-content: space-between;
 gap: 14px;
 padding: 15px 16px;
 background-color: var(--card-bg);
 border: 1px solid var(--card-border);
 border-radius: 14px;
 }
 .ver-card:hover {
 border-color: var(--card-hover-border);
 }
 .ver-meta {
 display: flex;
 flex-direction: column;
 gap: 5px;
 min-width: 0;
 }
 .ver-name {
 font-size: 16px;
 font-weight: 600;
 color: var(--text-main);
 letter-spacing: 0.3px;
 line-height: 1.2;
 }
 .ver-size {
 font-size: 12.5px;
 color: var(--text-sub);
 letter-spacing: 0.2px;
 }

 /* 卡片右侧：下载按钮 */
 .dl-btn {
 flex-shrink: 0;
 display: inline-flex;
 align-items: center;
 gap: 6px;
 padding: 9px 16px;
 font-size: 14px;
 font-weight: 600;
 letter-spacing: 0.3px;
 color: var(--btn-text);
 background-color: var(--btn-bg);
 border-radius: 999px;
 text-decoration: none;
 transition:
 opacity 0.25s ease,
 transform 0.1s ease,
 background-color 0.45s ease,
 color 0.45s ease;
 }
 .dl-btn:hover {
 opacity: 0.88;
 }
 .dl-btn:active {
 transform: scale(0.97);
 }
 .dl-btn .icon {
 width: 15px;
 height: 15px;
 flex-shrink: 0;
 }
 .dl-btn .icon svg {
 width: 100%;
 height: 100%;
 fill: var(--btn-icon);
 display: block;
 }

 /* 手机端：留白收一点，卡片内边距略小 */
 @media (max-width: 560px) {
 .topbar-inner { padding: 0 16px; }
 .stage { padding: 18px 16px 48px; }
 .ver-card { padding: 14px; gap: 10px; }
 .ver-name { font-size: 15px; }
 .dl-btn { padding: 8px 14px; font-size: 13.5px; }
 }

 /* ---- 日/夜开关（与首页同一套，几何/动效不变）---- */
 .l {
 cursor: pointer;
 font-size: 1em;
 background-color: var(--switch-track);
 border-radius: 0.75em;
 box-shadow: 0.125em 0.125em 0 0.125em var(--switch-shadow) inset;
 color: var(--switch-sun);
 display: inline-flex;
 align-items: center;
 padding: 0.15em;
 width: 3em;
 height: 1.5em;
 transition:
 background-color 0.1s 0.3s ease-out,
 box-shadow 0.1s 0.3s ease-out;
 -webkit-appearance: none;
 -moz-appearance: none;
 appearance: none;
 }
 .l:before,
 .l:after {
 content: "";
 display: block;
 }
 .l:before {
 background-color: var(--switch-knob);
 border-radius: 50%;
 width: 1.2em;
 height: 1.2em;
 transition:
 background-color 0.1s 0.3s ease-out,
 transform 0.3s ease-out;
 z-index: 1;
 }
 .l:after {
 background:
 linear-gradient(transparent 50%, rgba(0, 0, 0, 0.15) 0) 0 50% / 50% 100%,
 repeating-linear-gradient(90deg, #bbb 0, #bbb, #bbb 20%, #999 20%, #999 40%)
 0 50% / 50% 100%,
 radial-gradient(circle at 50% 50%, #888 25%, transparent 26%);
 background-repeat: no-repeat;
 border: 0.25em solid transparent;
 border-left: 0.4em solid #d8d8d8;
 border-right: 0 solid transparent;
 transition:
 border-left-color 0.1s 0.3s ease-out,
 transform 0.3s ease-out;
 transform: translateX(-22.5%);
 transform-origin: 25% 50%;
 width: 1.2em;
 height: 1em;
 box-sizing: border-box;
 }
 .l:checked {
 background-color: var(--switch-track-on);
 box-shadow: 0.125em 0.125em 0 0.125em var(--switch-shadow-on) inset;
 }
 .l:checked:before {
 background-color: currentColor;
 transform: translateX(125%);
 }
 .l:checked:after {
 border-left-color: currentColor;
 transform: translateX(-2.5%) rotateY(180deg);
 }
 .l:focus {
 outline: 0;
 }
 .l:focus-visible {
 outline: 2px solid var(--switch-sun);
 outline-offset: 2px;
 }
 /* 放进标题栏：靠右 */
 .topbar .l {
 margin: 0;
 margin-left: auto;
 flex-shrink: 0;
 }

 /* 日/夜切换的渐变过场 */
 #themeFx {
 position: fixed;
 inset: 0;
 z-index: 90;
 pointer-events: none;
 opacity: 0;
 background: radial-gradient(
 circle at var(--fx-x, calc(100% - 48px)) var(--fx-y, 32px),
 var(--fx-color, rgba(6, 6, 6, 0.55)) 0%,
 rgba(0, 0, 0, 0) 62%
 );
 }
 #themeFx.on {
 animation: themeWash 0.7s ease-out;
 }
 @keyframes themeWash {
 0% { opacity: 0; }
 35% { opacity: 1; }
 100% { opacity: 0; }
 }
 @media (prefers-reduced-motion: reduce) {
 #themeFx { display: none; }
 }
 </style>
</head>

 <script>
 /* ---- 日/夜模式切换：开关 + 渐变动画过场（与首页一致）---- */
 (function () {
  var root = document.documentElement;
  var sw = document.getElementById('themeSwitch');
  var fx = document.getElementById('themeFx');
  var meta = document.querySelector('meta[name="theme-color"]');

  function isDark() { return root.getAttribute('data-theme') === 'dark'; }
  function applyMeta(dark) {
   if (meta) meta.setAttribute('content', dark ? '#0f0f0f' : '#ffffff');
  }

  applyMeta(isDark());
  if (!sw) return;

  sw.checked = isDark();

  sw.addEventListener('change', function () {
   var dark = sw.checked;
   root.setAttribute('data-theme', dark ? 'dark' : 'light');
   applyMeta(dark);
   try { localStorage.setItem('theme', dark ? 'dark' : 'light'); } catch (e) {}

   if (fx) {
    var r = sw.getBoundingClientRect();
    fx.style.setProperty('--fx-x', (r.left + r.width / 2) + 'px');
    fx.style.setProperty('--fx-y', (r.top + r.height / 2) + 'px');
    fx.style.setProperty('--fx-color', dark ? 'rgba(6, 6, 6, 0.55)' : 'rgba(255, 255, 255, 0.6)');
    fx.classList.remove('on');
    void fx.offsetWidth;
    fx.classList.add('on');
   }
  });
 })();
 </script>
