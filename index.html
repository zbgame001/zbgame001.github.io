 justify-content: center;
 flex-shrink: 0;
 }
 .download-btn .icon svg {

 height: 100%;

 }
 .download-btn .info {

 .download-btn .info .name {
 font-size: 16px;

 .download-btn .info .status {

 @media (max-width: 850px) {
