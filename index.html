<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>文字游戏-主播模拟器</title>
<link rel="icon" href="./favicon.ico">
<style>
  :root{
    --bg:#ffffff;
    --text:#111827;
    --muted:#6b7280;
    --line:#eceff3;
    --hover:#f4f6f9;
    --green:#22c55e;
    --green-dark:#16a34a;
  }

  *{ box-sizing:border-box; }

  html,body{
    margin:0;
    padding:0;
    background:var(--bg);
    color:var(--text);
  }

  body{
    min-height:100vh;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
    text-rendering:optimizeLegibility;
  }

  /* ===== 第一行：标题栏 ===== */
  .app-header{
    position:sticky;
    top:0;
    z-index:20;
    background:var(--bg);
    padding-top:env(safe-area-inset-top, 0px);
  }

  .app-header::after{
    content:"";
    display:block;
    height:1px;
    background:linear-gradient(90deg, transparent, var(--line) 12%, var(--line) 88%, transparent);
  }

  .header-inner{
    display:flex;
    align-items:center;
    gap:10px;
    height:56px;
    padding:0 16px;
    max-width:1080px;
    margin:0 auto;
  }

  .brand-icon{
    flex:0 0 auto;
    width:32px;
    height:32px;
    border-radius:9px;
    object-fit:cover;
    display:block;
    box-shadow:0 0 0 1px rgba(17,24,39,.06);
  }

  .brand-title{
    font-size:16px;
    line-height:1.2;
    font-weight:600;
    letter-spacing:.2px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    user-select:none;
  }

  .header-actions{
    margin-left:auto;
    display:flex;
    align-items:center;
  }

  .menu-btn{
    -webkit-appearance:none;
    appearance:none;
    border:0;
    padding:0;
    width:40px;
    height:40px;
    border-radius:10px;
    background:transparent;
    color:inherit;
    display:grid;
    place-items:center;
    cursor:default;
    -webkit-tap-highlight-color:transparent;
    transition:background-color .15s ease;
  }

  .menu-btn svg{
    display:block;
    width:22px;
    height:22px;
  }

  .menu-btn:hover{ background:var(--hover); }

  /* ===== 内容区 ===== */
  .page{
    max-width:1080px;
    margin:0 auto;
    padding:0 16px calc(24px + env(safe-area-inset-bottom, 0px));
  }

  /* 第二、三行作为整体一起上滑 */
  .hero-stack{
    padding-top:24px;
    animation:rise-in .62s cubic-bezier(.22,1,.36,1) .06s both;
  }

  @keyframes rise-in{
    from{
      opacity:0;
      transform:translateY(22px);
    }
    to{
      opacity:1;
      transform:translateY(0);
    }
  }

  /* ===== 第二行：图标 + 名称 + 版本 ===== */
  .hero-head{
    display:flex;
    align-items:center;
    gap:14px;
  }

  .hero-icon{
    flex:0 0 auto;
    width:56px;
    height:56px;
    border-radius:16px;
    object-fit:cover;
    display:block;
    box-shadow:0 0 0 1px rgba(17,24,39,.06), 0 4px 12px rgba(17,24,39,.06);
  }

  .hero-meta{
    min-width:0;
    display:flex;
    flex-direction:column;
    justify-content:center;
    gap:5px;
  }

  .hero-title{
    margin:0;
    font-size:19px;
    line-height:1.25;
    font-weight:600;
    letter-spacing:.2px;
    color:var(--text);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }

  .hero-version{
    display:flex;
    align-items:center;
    gap:6px;
    font-size:13px;
    line-height:1.3;
    color:var(--muted);
    min-height:18px;
  }

  /* 在线状态小圆点 */
  .hero-version::before{
    content:"";
    width:6px;
    height:6px;
    border-radius:50%;
    background:var(--green);
    flex:0 0 auto;
  }

  .version-value{
    font-weight:600;
    color:#374151;
    font-variant-numeric:tabular-nums;
  }

  .hero-version.is-error::before{ background:#f59e0b; }

  /* ===== 第三行：下载按钮 ===== */
  .download-btn{
    margin-top:22px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:9px;
    width:100%;
    height:54px;
    padding:0 18px;
    border-radius:14px;
    border:0;
    background:linear-gradient(180deg,#2bd06d 0%, var(--green) 55%, #1cb45a 100%);
    color:#fff;
    font-size:16px;
    font-weight:600;
    letter-spacing:.3px;
    text-decoration:none;
    -webkit-tap-highlight-color:transparent;
    user-select:none;
    box-shadow:0 6px 18px rgba(34,197,94,.28), inset 0 1px 0 rgba(255,255,255,.22);
    transition:transform .12s ease, box-shadow .2s ease, filter .2s ease;
  }

  .download-btn svg{
    display:block;
    width:21px;
    height:21px;
    flex:0 0 auto;
  }

  .download-btn:hover{
    filter:brightness(1.03);
    box-shadow:0 8px 22px rgba(34,197,94,.34), inset 0 1px 0 rgba(255,255,255,.22);
  }

  .download-btn:active{
    transform:translateY(1px) scale(.995);
    box-shadow:0 4px 12px rgba(34,197,94,.24), inset 0 1px 0 rgba(255,255,255,.18);
  }

  .download-btn:focus-visible{
    outline:3px solid rgba(34,197,94,.35);
    outline-offset:2px;
  }

  @media (max-width:380px){
    .brand-title{ font-size:15px; }
    .header-inner{ gap:9px; padding:0 14px; }
    .page{ padding-left:14px; padding-right:14px; }
    .hero-title{ font-size:18px; }
    .hero-icon{ width:52px; height:52px; border-radius:15px; }
  }

  @media (prefers-reduced-motion: reduce){
    .hero-stack{ animation:none; }
    .download-btn{ transition:none; }
  }
</style>
</head>
<body>

  <!-- 第一行 -->
  <header class="app-header">
    <div class="header-inner">
      <img class="brand-icon" src="./favicon.ico" alt="主播模拟器图标" width="32" height="32">
      <h1 class="brand-title">文字游戏-主播模拟器</h1>

      <div class="header-actions">
        <!-- 占位：暂不绑定点击行为 -->
        <button class="menu-btn" type="button" aria-label="菜单" aria-disabled="true" data-placeholder="menu">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <main class="page">
    <!-- 第二、三行：整体上滑入场 -->
    <div class="hero-stack">

      <!-- 第二行 -->
      <section class="hero-head">
        <img class="hero-icon" src="./favicon.ico" alt="主播模拟器图标" width="56" height="56">
        <div class="hero-meta">
          <h2 class="hero-title">文字游戏-主播模拟器</h2>
          <p class="hero-version" data-version-wrap>
            <span>版本</span>
            <span class="version-value" data-version>检测中…</span>
          </p>
        </div>
      </section>

      <!-- 第三行 -->
      <a class="download-btn" href="./game.apk" download>
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M17.6 9.48l1.84-3.18a.62.62 0 0 0-.26-.85.62.62 0 0 0-.83.22l-1.88 3.24a11.46 11.46 0 0 0-8.94 0L5.65 5.67a.62.62 0 0 0-.87-.2.62.62 0 0 0-.22.83L6.4 9.48A10.78 10.78 0 0 0 1 18h22a10.78 10.78 0 0 0-5.4-8.52zM7 15.25a1.25 1.25 0 1 1 0-2.5 1.25 1.25 0 0 1 0 2.5zm10 0a1.25 1.25 0 1 1 0-2.5 1.25 1.25 0 0 1 0 2.5z"/>
        </svg>
        <span>Android下载</span>
      </a>

    </div>
  </main>

  <script>
  /* 版本自动检测：读取站点发布元数据 app/api/version.json
     （由 pages.conf 生成，跟 game.apk 同步发布） */
  (function () {
    var wrap = document.querySelector('[data-version-wrap]');
    var el = document.querySelector('[data-version]');
    if (!wrap || !el) return;

    function render(name, code) {
      if (!name) throw new Error('no version');
      el.textContent = name;
      el.title = code ? ('版本号 ' + code) : name;
    }

    function fail() {
      el.textContent = '暂不可用';
      wrap.classList.add('is-error');
    }

    // 禁缓存，避免 GitHub Pages / CDN 返回旧版本号
    fetch('./app/api/version.json?t=' + Date.now(), { cache: 'no-store' })
      .then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      })
      .then(function (j) {
        var d = (j && j.data) || j || {};
        render(d.latest_version_name, d.latest_version_code);
      })
      .catch(fail);
  })();
  </script>

</body>
</html>
