(function(){

var active="fn",query="",shown=0,PAGE=150;

function rowsOf(k){var arr=P.rows[k]||[],q=query.toLowerCase(),out=[];for(var i=0;i<arr.length;i++){var r=arr[i];if(q&&((r.n+" "+(r.d||"")+" "+(r.x||"")).toLowerCase().indexOf(q)<0))continue;out.push(r);}return out;}
